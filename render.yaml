# Diario de Progreso Gamer en Render: API y sitio estático.
# MONGODB_URI se completa en el panel (sync: false). No va en este archivo.
# VITE_API_URL toma sola la URL pública de la API, antes del build de Vite.
# CORS refleja el origen del navegador: el frontend vive en otro servicio.

services:
  - type: web
    name: diario-gamer-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/salud
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_DB
        value: diario_gamer
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGIN
        value: "*"

  - type: web
    name: diario-gamer-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: diario-gamer-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
